# Despliegue en Render (https://render.com) — Blueprint.
#
# Crea el servicio desde Dashboard → New → Blueprint y elige este repo.
# El disco persistente guarda music/ y data/ (usuarios, contraseñas de pista,
# sesiones y metadatos) para que sobrevivan a cada despliegue.
#
# El disco requiere una instancia de pago (Starter). Sin disco, el sitio
# funciona igual pero pierde subidas y cuentas en cada reinicio.
services:
  - type: web
    name: darkwaves-links
    runtime: node
    plan: starter
    region: oregon
    branch: main
    buildCommand: npm install --no-audit --no-fund
    startCommand: node server.mjs
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      # Carpeta persistente: un único disco montado en /var/data.
      - key: DARKWAVES_DATA_DIR
        value: /var/data/data
      - key: DARKWAVES_MUSIC_DIR
        value: /var/data/music
      # Cuenta principal del panel. Se usa solo la primera vez, cuando data/
      # todavía está vacío; después se cambia en /admin → Seguridad.
      - key: DARKWAVES_ADMIN_USER
        sync: false
      - key: DARKWAVES_ADMIN_PASSWORD
        sync: false
      # Dominio propio: https://josspreview.profilebio.me
      - key: DARKWAVES_PUBLIC_URL
        value: https://josspreview.profilebio.me
    disk:
      name: darkwaves-data
      mountPath: /var/data
      sizeGB: 5
