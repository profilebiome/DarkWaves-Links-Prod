name: Compilar app Android (APK)

# Genera el APK de DarkWaves con bloqueo de captura (FLAG_SECURE).
# El APK queda como artefacto descargable de la ejecución.

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar APK
        run: gradle -p android-app assembleDebug --no-daemon --stacktrace

      - name: Subir el APK
        uses: actions/upload-artifact@v4
        with:
          name: DarkWaves-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
