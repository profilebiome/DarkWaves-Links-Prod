name: Actualizar playlist

on:
  push:
    branches: [main]
    paths:
      - "music/**"
      - "!music/tracks.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generar music/tracks.json
        run: node tools/build-manifest.mjs

      - name: Guardar cambios
        run: |
          if [ -z "$(git status --porcelain music/tracks.json)" ]; then
            echo "La playlist ya está al día."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add music/tracks.json
          git commit -m "Actualizar playlist"
          git push
