<!doctype html>
<meta charset="utf-8">
<title>pruebas</title>
<pre id="out">corriendo…</pre>
<script>
const out = document.getElementById("out");
const log = (line) => { out.textContent += "\n" + line; };
const tryFetch = async (label, fn) => {
  try {
    const res = await fn();
    log(label + " → OK " + String(res).slice(0, 160));
  } catch (e) {
    log(label + " → FALLA " + e.message);
  }
};

async function jsonPost(url, body) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const text = await r.text();
  return r.status + " " + text.slice(0, 120);
}

async function filePost(url, extra = {}) {
  const bytes = new Uint8Array(1024); bytes.fill(3);
  const fd = new FormData();
  for (const [k, v] of Object.entries(extra)) fd.append(k, v);
  fd.append("fileToUpload", new File([bytes], "prueba.mp3", { type: "audio/mpeg" }));
  fd.append("file", new File([bytes], "prueba.mp3", { type: "audio/mpeg" }));
  const r = await fetch(url, { method: "POST", body: fd });
  const text = await r.text();
  return r.status + " " + text.slice(0, 120);
}

(async () => {
  out.textContent = "inicio";
  await tryFetch("jsonblob POST", () => jsonPost("https://jsonblob.com/api/jsonBlob", { a: 1 }));
  await tryFetch("extendsclass POST", () => jsonPost("https://api.extendsclass.com/json-storage/bin", { a: 1 }));
  await tryFetch("jsonstorage.net POST", () => jsonPost("https://jsonstorage.net/api/items", { a: 1 }));
  await tryFetch("kvdb POST", async () => { const r = await fetch("https://kvdb.io/", { method: "POST" }); return r.status + " " + (await r.text()).slice(0, 80); });
  await tryFetch("catbox", () => filePost("https://catbox.moe/user/api.php", { reqtype: "fileupload" }));
  await tryFetch("litterbox", () => filePost("https://litterbox.catbox.moe/resources/internals/api.php", { reqtype: "fileupload", time: "72h" }));
  await tryFetch("0x0.st", () => filePost("https://0x0.st"));
  await tryFetch("tmpfiles", () => filePost("https://tmpfiles.org/api/v1/upload"));
  await tryFetch("uguu", () => filePost("https://uguu.se/upload.php?output=text"));
  log("== fin ==");
})();
</script>
