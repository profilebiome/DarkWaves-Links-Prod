plugins {
    id 'com.android.application'
}

android {
    namespace 'me.profilebio.darkwaves'
    compileSdk 34

    defaultConfig {
        applicationId 'me.profilebio.darkwaves'
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName '1.5'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

// Sin dependencias externas: WebView viene en Android.
